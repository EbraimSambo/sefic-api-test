services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Your_password123}
    ports:
      - "${SQL_PORT:-14334}:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Server=db,1433;Database=SeficPartners;User Id=sa;Password=${SA_PASSWORD:-Your_password123};TrustServerCertificate=True
      # Aplica as migrações no arranque e insere dados de exemplo se o cadastro estiver vazio.
      Seed__Enabled: "true"
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  sqldata:
